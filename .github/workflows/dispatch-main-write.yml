name: Dispatch Main Write

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: dispatch-main-write
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch Main Write
    runs-on: ubuntu-24.04
    timeout-minutes: 3

    steps:
      - name: Notify Action Worker
        env:
          AW_DISPATCH_TOKEN: ${{ secrets.AW_DISPATCH_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REQUEST_ID: main-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -Eeuo pipefail

          [ -n "$AW_DISPATCH_TOKEN" ] || {
            echo "::error::AW_DISPATCH_TOKEN is not configured." >&2
            exit 77
          }

          payload="$(
            jq -cn \
              --arg request_id "$REQUEST_ID" \
              --arg repository "$REPOSITORY" \
              --arg before_sha "$BEFORE_SHA" \
              --arg head_sha "$HEAD_SHA" \
              '{
                event_type: "run-main-write-guard",
                client_payload: {
                  schema_version: "1",
                  request_id: $request_id,
                  repository: $repository,
                  before_sha: $before_sha,
                  head_sha: $head_sha,
                  event: "push"
                }
              }'
          )"

          curl -fsS \
            --retry 2 \
            --retry-delay 1 \
            --request POST \
            --header "Authorization: Bearer $AW_DISPATCH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY_OWNER/action-worker/dispatches" \
            --data "$payload"
