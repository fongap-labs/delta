name: Temporary prune validation
on:
  push:
    branches: [chore/prune-benchmarks-snapshots-experimental]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.28.5
      - name: Refresh lockfile from pruned workspace
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore(lockfile): reconcile benchmark and experimental removals"
            git push origin HEAD:chore/prune-benchmarks-snapshots-experimental
          fi
      - name: pnpm install
        run: pnpm install
      - name: Delta full CI verification and build preparation
        run: node scripts/delta-verify.mjs --ci
      - name: Prepare Client build declarations
        run: pnpm run build:lib:client
      - name: pnpm run build:check
        run: pnpm run build:check
