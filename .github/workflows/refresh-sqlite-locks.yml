name: Private SQLite lockfile refresh

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/refresh-sqlite-locks.yml"
      - "projects/delta/**/Cargo.toml"

permissions:
  contents: write

concurrency:
  group: refresh-sqlite-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh patched SQLite locks in private CI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout pull request source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Install Rust toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 --version
      - name: Refresh only rusqlite dependency chain
        shell: bash
        run: |
          set -Eeuo pipefail
          for root in \
            projects/delta/crates/delta-core \
            projects/delta/crates/delta-computer \
            projects/delta/apps/desktop/src-tauri
          do
            cargo +1.89.0 update --manifest-path "$root/Cargo.toml" -p rusqlite --precise 0.41.1
          done
      - name: Reject vulnerable SQLite and incomplete lockfiles
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import pathlib, tomllib
          roots = [
              pathlib.Path("projects/delta/crates/delta-core"),
              pathlib.Path("projects/delta/crates/delta-computer"),
              pathlib.Path("projects/delta/apps/desktop/src-tauri"),
          ]
          for root in roots:
              data = tomllib.loads((root / "Cargo.lock").read_text())
              packages = {p["name"]: p["version"] for p in data["package"]}
              if not packages.get("rusqlite", "").startswith("0.41."):
                  raise SystemExit("Incomplete safe rusqlite lock update")
              version = packages.get("libsqlite3-sys", "")
              if version not in {"0.39.0", "0.39.1"}:
                  raise SystemExit("Unsafe libsqlite3-sys lock resolution")
          PY
      - name: Commit refreshed Cargo locks to this PR branch
        if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/sqlite-cve-upgrade-20261114'
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            projects/delta/crates/delta-core/Cargo.lock \
            projects/delta/crates/delta-computer/Cargo.lock \
            projects/delta/apps/desktop/src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo lockfiles are already current."
            exit 0
          fi
          git commit -m "fix: refresh bundled SQLite dependency locks"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Retain patched Cargo locks inside private repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: patched-sqlite-locks
          path: |
            projects/delta/crates/delta-core/Cargo.lock
            projects/delta/crates/delta-computer/Cargo.lock
            projects/delta/apps/desktop/src-tauri/Cargo.lock
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
