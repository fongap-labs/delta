name: Dispatch PR Governance

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  statuses: write

concurrency:
  group: dispatch-pr-governance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: Dispatch PR Governance
    runs-on: ubuntu-24.04
    timeout-minutes: 3

    steps:
      - name: Dispatch central governance
        env:
          ACTION_WORKER_TOKEN: ${{ secrets.ACTION_WORKER_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REQUEST_ID: pr-${{ github.repository_id }}-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          TARGET_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          set_status() {
            local state="$1"
            local description="$2"
            local payload
            payload="$(jq -cn \
              --arg state "$state" \
              --arg context "PR Governance" \
              --arg description "$description" \
              --arg target_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              '{state:$state, context:$context, description:$description, target_url:$target_url}')"
            curl -fsS \
              --request POST \
              --header "Authorization: Bearer $TARGET_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/statuses/$HEAD_SHA" \
              --data "$payload" >/dev/null
          }

          on_error() {
            local code=$?
            set +e
            set_status failure "PR governance dispatch failed"
            exit "$code"
          }
          trap on_error ERR

          set_status pending "PR governance dispatch pending"

          if [ -z "$ACTION_WORKER_TOKEN" ]; then
            echo "::error::ACTION_WORKER_TOKEN is not configured." >&2
            false
          fi

          payload="$(
            jq -cn \
              --arg request_id "$REQUEST_ID" \
              --arg repository "$REPOSITORY" \
              --argjson pr_number "$PR_NUMBER" \
              '{
                event_type: "run-pr-governance",
                client_payload: {
                  schema_version: "1",
                  request_id: $request_id,
                  repository: $repository,
                  pr_number: $pr_number
                }
              }'
          )"

          curl -fsS \
            --retry 2 \
            --retry-delay 1 \
            --request POST \
            --header "Authorization: Bearer $ACTION_WORKER_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY_OWNER/action-worker/dispatches" \
            --data "$payload"
