name: 调度 PR 治理

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions: {}

concurrency:
  group: dispatch-pr-governance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: 调度 PR 治理
    runs-on: ubuntu-24.04
    timeout-minutes: 3

    steps:
      - name: 校验触发凭据
        env:
          ACTION_WORKER_PAT: ${{ secrets.ACTION_WORKER_PAT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [ -n "$ACTION_WORKER_PAT" ] || {
            echo "::error::缺少 ACTION_WORKER_PAT。" >&2
            exit 1
          }

      - name: 触发中央治理
        env:
          ACTION_WORKER_PAT: ${{ secrets.ACTION_WORKER_PAT }}
          ACTION_WORKER_REPOSITORY: ${{ vars.ACTION_WORKER_REPOSITORY }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REQUEST_ID: pr-${{ github.repository_id }}-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -Eeuo pipefail

          action_worker_repository="$ACTION_WORKER_REPOSITORY"
          [[ "$action_worker_repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || {
            echo "::error::ACTION_WORKER_REPOSITORY is not configured or invalid." >&2
            exit 77
          }

          payload="$(jq -cn             --arg request_id "$REQUEST_ID"             --arg repository "$REPOSITORY"             --argjson pr_number "$PR_NUMBER"             '{
              event_type: "run-pr-governance",
              client_payload: {
                schema_version: "1",
                request_id: $request_id,
                repository: $repository,
                pr_number: $pr_number
              }
            }')"

          curl -fsS             --retry 2             --retry-delay 1             --request POST             --header "Authorization: Bearer $ACTION_WORKER_PAT"             --header "Accept: application/vnd.github+json"             --header "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$action_worker_repository/dispatches"             --data "$payload"
