name: Dispatch Release Governance

on:
  workflow_run:
    workflows: [Portable Release]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: dispatch-release-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch release governance
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3

    steps:
      - name: Validate dispatch credential
        env:
          ACTION_WORKER_PAT: ${{ secrets.ACTION_WORKER_PAT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [ -n "$ACTION_WORKER_PAT" ] || {
            echo "::error::ACTION_WORKER_PAT is not configured." >&2
            exit 1
          }

      - name: Dispatch central release governance
        env:
          ACTION_WORKER_PAT: ${{ secrets.ACTION_WORKER_PAT }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          REQUEST_ID: release-${{ github.repository_id }}-${{ github.event.workflow_run.id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -Eeuo pipefail

          payload="$(
            jq -cn \
              --arg request_id "$REQUEST_ID" \
              --arg repository "$REPOSITORY" \
              --arg source_sha "$SOURCE_SHA" \
              --argjson source_run_id "$SOURCE_RUN_ID" \
              '{
                event_type: "run-release",
                client_payload: {
                  schema_version: "1",
                  request_id: $request_id,
                  repository: $repository,
                  source_sha: $source_sha,
                  source_run_id: $source_run_id,
                  artifact_name: "delta-release"
                }
              }'
          )"

          curl -fsS \
            --retry 2 \
            --retry-delay 1 \
            --request POST \
            --header "Authorization: Bearer $ACTION_WORKER_PAT" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/fongap/action-worker/dispatches \
            --data "$payload"
