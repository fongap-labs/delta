name: Dispatch Release Governance

on:
  workflow_run:
    workflows: [Portable Release]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: dispatch-release-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch release governance
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3

    steps:
      - name: Validate dispatch credential
        env:
          AW_DISPATCH_TOKEN: ${{ secrets.AW_DISPATCH_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [ -n "$AW_DISPATCH_TOKEN" ] || {
            echo "::error::AW_DISPATCH_TOKEN is not configured." >&2
            exit 1
          }

      - name: Dispatch central release governance
        env:
          AW_DISPATCH_TOKEN: ${{ secrets.AW_DISPATCH_TOKEN }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          ARTIFACT_REPOSITORY: ${{ github.repository }}
          ARTIFACT_RUN_ID: ${{ github.event.workflow_run.id }}
          REQUEST_ID: release-${{ github.repository_id }}-${{ github.event.workflow_run.id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -Eeuo pipefail

          payload="$(
            jq -cn \
              --arg request_id "$REQUEST_ID" \
              --arg source_repository "$SOURCE_REPOSITORY" \
              --arg source_sha "$SOURCE_SHA" \
              --arg artifact_repository "$ARTIFACT_REPOSITORY" \
              --argjson artifact_run_id "$ARTIFACT_RUN_ID" \
              '{
                event_type: "run-release",
                client_payload: {
                  schema_version: "2",
                  request_id: $request_id,
                  source_repository: $source_repository,
                  source_sha: $source_sha,
                  artifact_repository: $artifact_repository,
                  artifact_run_id: $artifact_run_id,
                  artifact_name: "delta-release"
                }
              }'
          )"

          curl -fsS \
            --retry 2 \
            --retry-delay 1 \
            --request POST \
            --header "Authorization: Bearer $AW_DISPATCH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY_OWNER/action-worker/dispatches" \
            --data "$payload"
