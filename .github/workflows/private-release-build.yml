name: 手动 · 私有发布构建验证

# Manual source-owned build; release assets and verification evidence stay in this PRIVATE repository.
# No artifact or source content is sent to the public Action Worker repository, and no deployment or publication occurs.
on:
  workflow_dispatch:
    inputs:
      requested_version:
        description: 仅验证构建，版本 X.Y.Z 或 X.Y.Z-beta.N
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: private-release-build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Require immutable source-owned release input
    uses: fongap-labs/action-worker/.github/workflows/private-release-preflight.yml@1f46ad902cf0e9391ce4bf9f6394b776577405d8
    with:
      source_sha: ${{ github.sha }}
      action_worker_sha: 1f46ad902cf0e9391ce4bf9f6394b776577405d8
      product: delta
      requested_version: ${{ inputs.requested_version }}

  build:
    name: Validate private Windows build / ${{ matrix.build_id }}
    needs: preflight
    if: needs.preflight.result == 'success'
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        build_id: [windows-portable, python-runtime]
    steps:
      - name: Reject non-private or moved main build
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          IS_PRIVATE: ${{ github.event.repository.private }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          RELEASE_VERSION: ${{ inputs.requested_version }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:EVENT -ne "workflow_dispatch" -or $env:IS_PRIVATE -ne "true") { throw "Manual private event required." }
          if ($env:SOURCE_REF -ne "refs/heads/main") { throw "Private release builds require main." }
          if ($env:SOURCE_SHA -notmatch "^[0-9a-f]{40}$") { throw "Invalid source SHA." }
          if ($env:RELEASE_VERSION -notmatch "^v?[0-9]+\.[0-9]+\.[0-9]+(-beta\.[1-9][0-9]*)?$") { throw "Invalid release version." }

      - name: Checkout exact private source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false

      - name: Setup Python from source version
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: source/projects/delta/.python-version

      - name: Setup Node from source version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: source/projects/delta/.nvmrc

      - name: Setup Rust for Windows
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Execute allowlisted release build without transferring artifacts
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.sha }}
          BUILD_ID: ${{ matrix.build_id }}
          RELEASE_VERSION: ${{ inputs.requested_version }}
        run: |
          $ErrorActionPreference = "Stop"
          if ((git -C source rev-parse HEAD).Trim() -ne $env:SOURCE_SHA) { throw "Source SHA mismatch." }
          $root = Join-Path $env:GITHUB_WORKSPACE "source/projects/delta"
          $manifest = Get-Content -Raw -LiteralPath (Join-Path $root "release.manifest.json") | ConvertFrom-Json
          if ($manifest.schema_version -ne 1 -or $manifest.root -ne "projects/delta") { throw "Unexpected release manifest." }
          $matching = @($manifest.builds | Where-Object { $_.id -eq $env:BUILD_ID })
          if ($matching.Count -ne 1) { throw "Missing or duplicate release build." }
          $build = $matching[0]
          $scripts = @{
            "windows-portable" = "scripts/release-build.ps1"
            "python-runtime" = "scripts/release-build-runtime.ps1"
          }
          if (-not $scripts.ContainsKey($env:BUILD_ID) -or $build.script -ne $scripts[$env:BUILD_ID]) { throw "Unapproved source script." }
          if ($build.runner_profile -ne "windows-build" -or $build.target -ne "x86_64-pc-windows-msvc") { throw "Wrong build platform." }
          $script = Join-Path $root $scripts[$env:BUILD_ID]
          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) { throw "Missing build script." }
          $bundle = Join-Path $env:RUNNER_TEMP ("private-release-bundle/" + $env:BUILD_ID)
          $output = Join-Path $bundle "assets"
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          $env:RELEASE_PRODUCT_ROOT = $root
          & $script -Target $build.target -Version $env:RELEASE_VERSION.TrimStart("v") -OutputDir $output
          if ($LASTEXITCODE -ne 0) { throw "Release build failed." }
          $expected = @($build.assets | ForEach-Object { [string]$_ } | Sort-Object)
          $actual = @(Get-ChildItem -LiteralPath $output -File | ForEach-Object { $_.Name } | Sort-Object)
          if ($expected.Count -eq 0 -or ($expected -join "|") -ne ($actual -join "|")) { throw "Unexpected release asset names." }
          if ($build.attest_asset -notin $expected) { throw "Missing attested asset." }
          $assetRecords = @()
          foreach ($asset in $actual) {
            $item = Join-Path $output $asset
            $size = (Get-Item -LiteralPath $item).Length
            if ($size -le 0) { throw "Empty release asset." }
            $hash = (Get-FileHash -LiteralPath $item -Algorithm SHA256).Hash.ToLowerInvariant()
            $assetRecords += [ordered]@{ name = $asset; sha256 = $hash; size = $size }
          }
          $record = [ordered]@{
            schema_version = 1
            repository = $env:GITHUB_REPOSITORY
            source_sha = $env:SOURCE_SHA
            build_id = $env:BUILD_ID
            version = $env:RELEASE_VERSION
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            assets = @($assetRecords)
          }
          $record | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $bundle "manifest.json") -Encoding utf8
          # Build-stage proof contains only names, lengths and digests, never credentials.

      - name: Checkout pinned Action Worker privacy scanner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fongap-labs/action-worker
          ref: 1f46ad902cf0e9391ce4bf9f6394b776577405d8
          path: trusted-aw
          persist-credentials: false

      - name: Scan private release bundle before artifact retention
        shell: pwsh
        env:
          BUILD_ID: ${{ matrix.build_id }}
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = Join-Path $env:RUNNER_TEMP ("private-release-bundle/" + $env:BUILD_ID)
          python trusted-aw/scripts/artifact-privacy-scan.py $bundle trusted-aw/policies/security.json
          if ($LASTEXITCODE -ne 0) { throw "Private release privacy scan failed." }

      - name: Upload immutable private build evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: private-release-${{ github.sha }}-${{ matrix.build_id }}
          path: ${{ runner.temp }}/private-release-bundle/${{ matrix.build_id }}/
          if-no-files-found: error
          retention-days: 7

      - name: Delete transient release outputs
        if: always()
        shell: pwsh
        env:
          BUILD_ID: ${{ matrix.build_id }}
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP ("private-release-bundle/" + $env:BUILD_ID)
          if (Test-Path -LiteralPath $bundle) {
            Remove-Item -LiteralPath $bundle -Recurse -Force
          }

  verify:
    name: Verify private build evidence / ${{ matrix.build_id }}
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        build_id: [windows-portable, python-runtime]
    steps:
      - name: Checkout exact private source for independent manifest comparison
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false

      - name: Download only this run's private release evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: private-release-${{ github.sha }}-${{ matrix.build_id }}
          path: ${{ runner.temp }}/verified-private-release

      - name: Reject forged or incomplete release assets and manifests
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          BUILD_ID: ${{ matrix.build_id }}
          RELEASE_VERSION: ${{ inputs.requested_version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          [[ "$(git -C source rev-parse HEAD)" == "$SOURCE_SHA" ]] || exit 75
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re

          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "verified-private-release"
          evidence = root / "manifest.json"
          expected_manifest = pathlib.Path("source/projects/delta/release.manifest.json")
          if not evidence.is_file() or evidence.is_symlink() or evidence.stat().st_size > 65536:
              raise SystemExit("Invalid private release evidence.")
          actual = json.loads(evidence.read_text(encoding="utf-8-sig"))
          if not isinstance(actual, dict) or set(actual) != {
              "schema_version", "repository", "source_sha", "build_id", "version",
              "run_id", "run_attempt", "assets"
          }:
              raise SystemExit("Release evidence schema mismatch.")
          expected = json.loads(expected_manifest.read_text(encoding="utf-8"))
          builds = [item for item in expected["builds"] if item["id"] == os.environ["BUILD_ID"]]
          if len(builds) != 1 or expected["schema_version"] != 1:
              raise SystemExit("Source release manifest does not declare this build uniquely.")
          names = builds[0]["assets"]
          entries = actual["assets"]
          if (
              actual["schema_version"] != 1
              or actual["repository"] != os.environ["REPOSITORY"]
              or actual["source_sha"] != os.environ["SOURCE_SHA"]
              or actual["build_id"] != os.environ["BUILD_ID"]
              or actual["version"] != os.environ["RELEASE_VERSION"]
              or actual["run_id"] != os.environ["GITHUB_RUN_ID"]
              or actual["run_attempt"] != os.environ["GITHUB_RUN_ATTEMPT"]
              or not isinstance(entries, list)
              or not 0 < len(entries) <= 50
              or not isinstance(names, list)
              or len(names) != len(entries)
          ):
              raise SystemExit("Release evidence identity or inventory mismatch.")
          target = root / "assets"
          if (
              not root.is_dir()
              or root.is_symlink()
              or {p.name for p in root.iterdir()} != {"manifest.json", "assets"}
              or not target.is_dir()
              or target.is_symlink()
          ):
              raise SystemExit("Private release artifact root contains unexpected entries.")
          actual_files = list(target.iterdir())
          if len(actual_files) != len(entries) or any(
              not p.is_file() or p.is_symlink() for p in actual_files
          ):
              raise SystemExit("Unexpected private release assets.")
          observed = set()
          for entry in entries:
              if not isinstance(entry, dict) or set(entry) != {"name", "sha256", "size"}:
                  raise SystemExit("Invalid private release asset record.")
              name, digest, size = entry["name"], entry["sha256"], entry["size"]
              if (
                  not isinstance(name, str)
                  or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]*", name)
                  or name in observed
                  or name not in names
                  or not isinstance(digest, str)
                  or not re.fullmatch(r"[0-9a-f]{64}", digest)
                  or type(size) is not int
                  or size <= 0
              ):
                  raise SystemExit("Invalid private release asset identity.")
              file = target / name
              if not file.is_file() or file.is_symlink() or file.stat().st_size != size:
                  raise SystemExit("Private release asset size mismatch.")
              sha = hashlib.sha256()
              with file.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      sha.update(chunk)
              if sha.hexdigest() != digest:
                  raise SystemExit("Private release asset digest mismatch.")
              observed.add(name)
          if observed != set(names) or {p.name for p in actual_files} != observed:
              raise SystemExit("Private release asset inventory incomplete.")
          print("Private release artifact evidence and all SHA256 digests verified.")
          PY

      - name: Record read-only private verification outcome
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s\n' 'Private release asset inventory and SHA256: verified' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Evidence location: this private Actions run only' >> "$GITHUB_STEP_SUMMARY"
          # No cryptographic build attestation: private GitHub Artifact Attestations
          # require Enterprise Cloud. Never claim this manifest is signed.
