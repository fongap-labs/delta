name: Portable Release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: dispatch-release-build
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch central release build
    runs-on: ubuntu-24.04
    timeout-minutes: 3

    steps:
      - name: Dispatch Action Worker release build
        env:
          AW_DISPATCH_TOKEN: ${{ secrets.AW_DISPATCH_TOKEN }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          REQUEST_ID: release-build-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -Eeuo pipefail

          [ "$GITHUB_REF" = "refs/heads/main" ] || {
            echo "::error::Releases must be dispatched from main." >&2
            exit 65
          }

          [ -n "$AW_DISPATCH_TOKEN" ] || {
            echo "::error::AW_DISPATCH_TOKEN is not configured." >&2
            exit 77
          }

          payload="$(
            jq -cn \
              --arg request_id "$REQUEST_ID" \
              --arg source_repository "$SOURCE_REPOSITORY" \
              --arg source_sha "$SOURCE_SHA" \
              '{
                event_type: "run-release-build",
                client_payload: {
                  schema_version: "1",
                  request_id: $request_id,
                  source_repository: $source_repository,
                  source_sha: $source_sha,
                  requested_version: ""
                }
              }'
          )"

          curl -fsS \
            --retry 2 \
            --retry-delay 1 \
            --request POST \
            --header "Authorization: Bearer $AW_DISPATCH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY_OWNER/action-worker/dispatches" \
            --data "$payload"
