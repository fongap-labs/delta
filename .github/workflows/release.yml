# Delta Windows Portable Release
#
# Release policy:
# - Releases are manually dispatched from main.
# - Repository version consistency is checked before any expensive build starts.
# - Action Worker revalidates the exact default-branch commit and its successful CI run.
# - The portable application is built on Windows from the current source tree.
# - The resulting archive is checked for structure, metadata, executable bootability,
#   and SHA-256 integrity before it can be published.
# - This workflow only produces a release artifact and manifest. Action Worker owns
#   target credentials, publication, download verification, and rollback.

name: Portable Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-release
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      actions: read

    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Validate release source and version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases must be dispatched from main (got $GITHUB_REF)"
            exit 1
          fi

          python3 scripts/check_release_versions.py --quiet --release

  build-portable:
    name: build-portable
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60

    permissions:
      contents: read
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Read Rust toolchain channel
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(grep '^channel' rust-toolchain.toml | tr -d '\r' | sed 's/.*"\(.*\)"/\1/')
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            apps/desktop/src-tauri
            packaging/portable/launcher

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build Windows portable release
        shell: pwsh
        run: .\packaging\portable\build-portable.ps1

      - name: Verify portable release
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"

          $files = @(Get-ChildItem -LiteralPath .\releases -File)

          $zip = @(
            $files |
              Where-Object Name -EQ "Delta-Windows-Portable.zip"
          )

          $sum = @(
            $files |
              Where-Object Name -EQ "Delta-Windows-Portable.zip.sha256"
          )

          if (
            $files.Count -ne 2 -or
            $zip.Count -ne 1 -or
            $sum.Count -ne 1
          ) {
            throw "releases/ must contain exactly the portable ZIP and its SHA256 file"
          }

          $expectedHash = (Get-Content -LiteralPath $sum[0].FullName -Raw).Trim().ToLower()
          $actualHash = (
            Get-FileHash -LiteralPath $zip[0].FullName -Algorithm SHA256
          ).Hash.ToLower()

          if ($expectedHash -ne $actualHash) {
            throw "portable SHA256 mismatch"
          }

          $entries = @(& tar -tf $zip[0].FullName)

          if ($LASTEXITCODE -ne 0) {
            throw "unable to list portable ZIP"
          }

          if (
            -not $entries.Count -or
            @($entries | Where-Object { $_ -notlike "Delta/*" }).Count
          ) {
            throw "portable ZIP must contain exactly one Delta/ top-level directory"
          }

          $forbidden = @(
            "delta-server",
            "fastapi",
            "uvicorn",
            "server_entry",
            "packaging/server",
            "packaging\server",
            "/sidecar/",
            "\sidecar\"
          )
          $badEntries = @()
          foreach ($entry in $entries) {
            $candidate = $entry.ToLowerInvariant()
            foreach ($pattern in $forbidden) {
              if ($candidate.Contains($pattern)) {
                $badEntries += $entry
                break
              }
            }
          }
          if ($badEntries.Count) {
            throw "portable ZIP contains retired application-backend artifacts: $($badEntries -join ', ')"
          }

          $verifyRoot = Join-Path $env:RUNNER_TEMP "delta-portable-verify"

          if (Test-Path -LiteralPath $verifyRoot) {
            Remove-Item -LiteralPath $verifyRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $verifyRoot | Out-Null

          & tar -xf $zip[0].FullName -C $verifyRoot

          if ($LASTEXITCODE -ne 0) {
            throw "unable to extract portable ZIP"
          }

          $requiredFiles = @(
            "Delta\Delta.exe",
            "Delta\App\Delta\Delta.exe",
            "Delta\Other\AppInfo\appinfo.xml"
          )

          foreach ($relativePath in $requiredFiles) {
            $absolutePath = Join-Path $verifyRoot $relativePath

            if (-not (Test-Path -LiteralPath $absolutePath -PathType Leaf)) {
              throw "portable artifact missing required file: $relativePath"
            }
          }

          $appInfoPath = Join-Path $verifyRoot "Delta\Other\AppInfo\appinfo.xml"
          [xml]$appInfo = Get-Content -LiteralPath $appInfoPath -Raw

          $actualVersion = [string]$appInfo.appinfo.version

          if ($actualVersion -ne $env:EXPECTED_VERSION) {
            throw "portable metadata version mismatch: expected $($env:EXPECTED_VERSION), got $actualVersion"
          }

          $appExe = Join-Path $verifyRoot "Delta\App\Delta\Delta.exe"
          $smokeState = Join-Path $env:RUNNER_TEMP "delta-portable-smoke-state"

          if (Test-Path -LiteralPath $smokeState) {
            Remove-Item -LiteralPath $smokeState -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $smokeState | Out-Null

          $oldStateDir = $env:DELTA_STATE_DIR
          $env:DELTA_STATE_DIR = $smokeState

          try {
            & $appExe --runtime-self-test

            if ($LASTEXITCODE -ne 0) {
              throw "packaged Rust Runtime self-test failed (exit $LASTEXITCODE)"
            }
          }
          finally {
            $env:DELTA_STATE_DIR = $oldStateDir
          }

          $unicodeRoot = Join-Path $env:RUNNER_TEMP "测试 Delta\Delta 移动测试\Delta"

          if (Test-Path -LiteralPath $unicodeRoot) {
            Remove-Item -LiteralPath $unicodeRoot -Recurse -Force
          }

          Copy-Item -Recurse -Force (Join-Path $verifyRoot "Delta") $unicodeRoot

          $unicodeExe = Join-Path $unicodeRoot "App\Delta\Delta.exe"
          $unicodeState = Join-Path $unicodeRoot "Data"

          if (-not (Test-Path -LiteralPath $unicodeState -PathType Container)) {
            throw "relocated portable did not preserve Data\ directory layout"
          }

          $oldStateDir = $env:DELTA_STATE_DIR
          $env:DELTA_STATE_DIR = $unicodeState

          try {
            & $unicodeExe --runtime-self-test

            if ($LASTEXITCODE -ne 0) {
              throw "packaged Rust Runtime self-test failed under Unicode+whitespace path (exit $LASTEXITCODE)"
            }
          }
          finally {
            $env:DELTA_STATE_DIR = $oldStateDir
          }

          Write-Host "Portable artifact verification passed:"
          Write-Host "  ZIP     : $($zip[0].FullName)"
          Write-Host "  SHA-256 : $actualHash"
          Write-Host "  Version : $actualVersion"
          Write-Host "  Unicode : $unicodeRoot"

      - name: Attest portable ZIP provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: releases/Delta-Windows-Portable.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-portable-build
          path: |
            releases/Delta-Windows-Portable.zip
            releases/Delta-Windows-Portable.zip.sha256
          if-no-files-found: error
          retention-days: 7

  package:
    name: package
    needs:
      - prepare
      - build-portable
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-portable-build
          path: dist

      - name: Verify portable artifact
        shell: bash
        run: |
          set -Eeuo pipefail

          zip="dist/Delta-Windows-Portable.zip"
          checksum="${zip}.sha256"

          [ -f "$zip" ] && [ -f "$checksum" ] || {
            echo "::error::portable release assets are incomplete" >&2
            exit 1
          }

          [ "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2 ] || {
            echo "::error::portable artifact must contain exactly ZIP and checksum" >&2
            exit 1
          }

          expected="$(tr -d '\r\n' < "$checksum" | awk '{print $1}' | tr '[:upper:]' '[:lower:]')"
          actual="$(sha256sum "$zip" | awk '{print $1}')"

          [ "$actual" = "$expected" ] || {
            echo "::error::portable SHA256 mismatch" >&2
            exit 1
          }

          mv "$zip" dist/delta-windows-x64-portable.zip
          rm -f "$checksum"

      - name: Generate release CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/delta-windows-x64-portable.sbom.cdx.json
          artifact-name: delta-release-sbom
          upload-artifact: false
          upload-release-assets: false

      - name: Build release manifest
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TARGET_REPOSITORY: ${{ vars.RELEASE_TARGET_REPOSITORY }}
        shell: bash
        run: |
          set -Eeuo pipefail

          target_repository="$RELEASE_TARGET_REPOSITORY"
          [[ "$target_repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || {
            echo "::error::RELEASE_TARGET_REPOSITORY is not configured or invalid." >&2
            exit 77
          }

          zip="delta-windows-x64-portable.zip"
          sbom="delta-windows-x64-portable.sbom.cdx.json"
          zip_hash="$(sha256sum "dist/$zip" | awk '{print $1}')"
          sbom_hash="$(sha256sum "dist/$sbom" | awk '{print $1}')"

          jq -n \
            --arg version "$RELEASE_VERSION" \
            --arg target_repository "$target_repository" \
            --arg zip "$zip" \
            --arg zip_hash "$zip_hash" \
            --arg sbom "$sbom" \
            --arg sbom_hash "$sbom_hash" \
            '{
              schema_version: "1",
              target_repository: $target_repository,
              release_key: "delta",
              version: $version,
              release_name: ("Delta " + $version),
              release_notes: "Delta Windows portable release.",
              prerelease: false,
              license: {expression: "Apache-2.0"},
              assets: [
                {name: $zip, sha256: $zip_hash},
                {name: $sbom, sha256: $sbom_hash}
              ]
            }' > dist/release-manifest.json

      - name: Verify release package
        shell: bash
        run: |
          set -Eeuo pipefail

          expected=(
            delta-windows-x64-portable.sbom.cdx.json
            delta-windows-x64-portable.zip
            release-manifest.json
          )

          mapfile -t actual < <(find dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)

          [ "$(printf '%s\n' "${actual[@]}")" = "$(printf '%s\n' "${wanted[@]}")" ] || {
            echo "::error::unexpected release package contents" >&2
            printf 'actual: %s\n' "${actual[*]}" >&2
            exit 1
          }

          jq -e --arg target_repository "$target_repository" '
            .schema_version == "1"
            and .target_repository == $target_repository
            and .release_key == "delta"
            and (.assets | length == 2)
          ' dist/release-manifest.json >/dev/null

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: delta-release
          path: dist/*
          if-no-files-found: error
          retention-days: 7
