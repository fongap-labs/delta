name: Validate Central Merge

on:
  repository_dispatch:
    types: [validate-central-merge]

permissions:
  contents: read
  statuses: read
  checks: write

jobs:
  validate:
    if: ${{ github.event.client_payload.schema_version == '1' }}
    uses: fongap-labs/action-worker/.github/workflows/validate-central-merge.yml@main
    with:
      head_sha: ${{ github.event.client_payload.head_sha }}
