name: Validate Central Merge

on:
  status:

permissions:
  contents: read
  statuses: read
  checks: write

jobs:
  validate:
    if: ${{ github.event.context == 'PR Governance' && github.event.state == 'success' }}
    uses: fongap-labs/action-worker/.github/workflows/validate-central-merge.yml@main
    with:
      head_sha: ${{ github.event.sha }}
