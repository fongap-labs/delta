name: License Policy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: license-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation-license-boundary:
    name: foundation-license-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enforce Foundation license and attribution boundary
        run: python3 scripts/check_license_policy.py

  rust-licenses:
    name: rust-licenses
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read Rust toolchain channel
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(grep '^channel' rust-toolchain.toml | tr -d '\r' | sed 's/.*"\(.*\)"/\1/')
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Licenses — Tauri app
        working-directory: apps/desktop/src-tauri
        run: cargo deny --config "$GITHUB_WORKSPACE/deny.toml" check licenses
      - name: Licenses — portable launcher
        working-directory: packaging/portable/launcher
        run: cargo deny --config "$GITHUB_WORKSPACE/deny.toml" check licenses
      - name: Licenses — STT service
        working-directory: crates/delta-stt
        run: cargo deny --config "$GITHUB_WORKSPACE/deny.toml" check licenses
      - name: Licenses — Delta Core runtime
        working-directory: crates/delta-core
        run: cargo deny --config "$GITHUB_WORKSPACE/deny.toml" check licenses
