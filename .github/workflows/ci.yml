# Delta CI
#
# Validation policy:
# - Pull Requests run checks according to the affected repository area.
# - Pushes to main always run the full CI suite.
# - Repository layout invariants always run.
# - ci-evidence aggregates project checks; validate-merge remains the single stable Required Check for main.
#
# Coverage:
# - Python runtime tests on supported Linux versions and Windows
# - Desktop TypeScript/unit tests
# - Hermetic Playwright e2e tests
# - Python/npm/Rust dependency advisory gates
# - Python static-analysis regression gates
# - Rust fmt/check/clippy/tests
# - Repository layout invariants
#
# Supply-chain policy:
# - Third-party GitHub Actions are pinned to immutable commit SHAs.
# - Tool versions that affect security/static baselines are explicitly pinned.
# - The root deny.toml is explicitly supplied to cargo-deny.
#
# Dependency-advisory policy:
# - npm audit / pip-audit / cargo-deny can fail on newly disclosed upstream
#   advisories that are unrelated to the current diff. This is intentional:
#   advisory gates are a point-in-time check, not a diff check. If a PR goes
#   red here for a change it didn't make, open a dedicated dependency-bump PR
#   rather than loosening the gate.
#
# Branch protection:
# - The main Ruleset requires only the stable `validate-merge` job.
# - Individual job names may evolve without stranding GitHub Required Checks.
# - main is only ever updated by merging an already-green PR, so the `push`
#   trigger does not need to be gated by `validate-merge` itself: if two pushes
#   land close together, `concurrency.cancel-in-progress` may cancel the
#   older run's `validate-merge` (see its `!cancelled()` guard below), and that
#   is expected, not a validation gap. If this repo ever allows direct pushes
#   to main outside of PR merges, this assumption must be revisited.
#
# ci-evidence maintenance note:
# - The "which jobs are required" logic is intentionally duplicated in two
#   places: each job's own `if:` (whether it *runs*) and the Python block in
#   `validate-merge` (whether it must *succeed*). These must be changed together.
#   Search for "MUST STAY IN SYNC" in both locations before editing either.

name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      python: ${{ steps.filter.outputs.python }}
      desktop: ${{ steps.filter.outputs.desktop }}
      rust: ${{ steps.filter.outputs.rust }}
      python_advisories: ${{ steps.filter.outputs.python_advisories }}
      rust_advisories: ${{ steps.filter.outputs.rust_advisories }}
      full: ${{ steps.filter.outputs.full }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "push" ]; then
            {
              echo "python=true"
              echo "desktop=true"
              echo "rust=true"
              echo "python_advisories=true"
              echo "rust_advisories=true"
              echo "full=true"
            } >> "$GITHUB_OUTPUT"

            echo "push to main: full CI selected"
            exit 0
          fi

          git diff --name-only "$BASE_SHA...$HEAD_SHA" > changed-files.txt
          bash scripts/detect-ci-path.sh < changed-files.txt > selected.txt
          source selected.txt

          echo "Changed files:"
          cat changed-files.txt
          echo
          echo "Selected checks:"
          echo "  python              = $python"
          echo "  desktop             = $desktop"
          echo "  rust                = $rust"
          echo "  python_advisories   = $python_advisories"
          echo "  rust_advisories     = $rust_advisories"
          echo "  full                = $full"

          cat selected.txt >> "$GITHUB_OUTPUT"

      - name: Self-test path selector
        run: bash scripts/test-ci-path.sh

  pytest:
    name: pytest (${{ matrix.python-version }})
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Read Rust toolchain channel
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(grep '^channel' rust-toolchain.toml | tr -d '\r' | sed 's/.*"\(.*\)"/\1/')
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: crates/delta-core
      - name: Build delta_core binary
        working-directory: crates/delta-core
        run: cargo build --release --bin delta_core
      - name: Install
        shell: bash
        run: |
          set -euo pipefail
          uv sync --locked --extra dev
          uv pip check --python .venv/bin/python
      - name: Test
        run: uv run --locked pytest tests -q
        env:
          DELTA_CORE_BINARY: ${{ github.workspace }}/crates/delta-core/target/release/delta_core

  pytest-windows:
    name: pytest-windows
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Read Rust toolchain channel
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(grep '^channel' rust-toolchain.toml | tr -d '\r' | sed 's/.*"\(.*\)"/\1/')
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: crates/delta-core
      - name: Build delta_core binary
        working-directory: crates/delta-core
        run: cargo build --release --bin delta_core
      - name: Install
        shell: pwsh
        run: |
          uv sync --locked --extra dev
          uv pip check --python .venv\Scripts\python.exe
      - name: Test
        run: uv run --locked pytest tests -q
        env:
          DELTA_CORE_BINARY: ${{ github.workspace }}\crates\delta-core\target\release\delta_core.exe

  desktop-unit:
    name: desktop-unit
    needs: changes
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: npm ci
        working-directory: apps/desktop
        run: npm ci
      - name: Dependency advisories
        working-directory: apps/desktop
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        working-directory: apps/desktop
        run: npx tsc --noEmit
      - name: Runtime contract fixtures
        working-directory: apps/desktop
        run: >
          npx vitest run
          src/api.contract.test.ts
          src/runtime-contract.test.ts
          src/api.auth.test.ts
      - name: Unit tests
        working-directory: apps/desktop
        run: >
          npm test --
          --exclude src/api.contract.test.ts
          --exclude src/runtime-contract.test.ts
          --exclude src/api.auth.test.ts

  desktop-e2e:
    name: desktop-e2e
    needs: changes
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: npm ci
        working-directory: apps/desktop
        run: npm ci
      - name: Install Playwright browser
        working-directory: apps/desktop
        run: npx playwright install --with-deps chromium
      - name: e2e
        working-directory: apps/desktop
        run: npm run e2e

  python-advisories:
    name: python-advisories
    needs: changes
    if: ${{ needs.changes.outputs.python_advisories == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Install full dependency set
        shell: bash
        run: |
          set -euo pipefail
          uv sync --locked --extra dev
          uv pip check --python .venv/bin/python
      - name: Dependency advisories
        run: uv run --locked pip-audit --skip-editable

  rust-advisories:
    name: rust-advisories
    needs: changes
    if: >-
      ${{
        needs.changes.outputs.rust == 'true' ||
        needs.changes.outputs.rust_advisories == 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read Rust toolchain channel
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(grep '^channel' rust-toolchain.toml | tr -d '\r' | sed 's/.*"\(.*\)"/\1/')
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Advisories — Tauri app
        working-directory: apps/desktop/src-tauri
        run: cargo deny --config "$GITHUB_WORKSPACE/deny.toml" check advisories
      - name: Advisories — portable launcher
        working-directory: packaging/portable/launcher
        run: cargo deny --config "$GITHUB_WORKSPACE/deny.toml" check advisories
      - name: Advisories — STT service
        working-directory: crates/delta-stt
        run: cargo deny --config "$GITHUB_WORKSPACE/deny.toml" check advisories
      - name: Advisories — Delta Core runtime
        working-directory: crates/delta-core
        run: cargo deny --config "$GITHUB_WORKSPACE/deny.toml" check advisories
      - name: Advisories — Delta SDK
        working-directory: crates/delta-sdk
        run: cargo deny --config "$GITHUB_WORKSPACE/deny.toml" check advisories
      - name: Advisories — Delta Connect
        working-directory: crates/delta-connect
        run: cargo deny --config "$GITHUB_WORKSPACE/deny.toml" check advisories
      - name: Advisories — Delta Sync
        working-directory: crates/delta-sync
        run: cargo deny --config "$GITHUB_WORKSPACE/deny.toml" check advisories

  rust-core-smoke:
    name: rust-core-smoke
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read Rust toolchain channel
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(grep '^channel' rust-toolchain.toml | tr -d '\r' | sed 's/.*"\(.*\)"/\1/')
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: crates/delta-core
      - name: Build delta_core binary
        working-directory: crates/delta-core
        run: cargo build --release --bin delta_core
      - name: Run rust-core smoke gate
        run: python scripts/check_rust_smoke.py --binary crates/delta-core/target/release/delta_core

  static:
    name: static
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Install locked static-analysis environment
        shell: bash
        run: |
          set -euo pipefail
          uv sync --locked --extra dev
          uv pip check --python .venv/bin/python
      - name: Ruff — blocking runtime-breaking classes
        run: >
          uv run --locked ruff check
          core
          integrations
          packages
          tests
          --select E9,F63,F7,F82
      - name: Ruff full scan — zero-error gate
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked ruff check \
            core \
            integrations \
            packages \
            tests \
            --output-format=json \
            > ruff-report.json || true
          uv run --locked python - <<'PY'
          import json
          with open("ruff-report.json", "r", encoding="utf-8") as fh:
              findings = json.load(fh)
          if not isinstance(findings, list):
              raise SystemExit("invalid Ruff JSON report")
          count = len(findings)
          print(f"ruff findings: {count}")
          if count > 0:
              for f in findings:
                  print(f"  {f.get('filename','?')}:{f.get('location',{}).get('row','?')} "
                        f"{f.get('code','?')} {f.get('message','?')}")
              raise SystemExit(f"ruff findings {count} > 0 — clean up the regression")
          PY
      - name: Pyright — zero-error gate
        run: |
          uv run --locked pyright \
            core \
            integrations \
            packages

  rust:
    name: rust (${{ matrix.workspace }})
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: apps/desktop/src-tauri
            tauri-deps: true
          - workspace: packaging/portable/launcher
            tauri-deps: false
          - workspace: crates/delta-core
            tauri-deps: false
          - workspace: crates/delta-sdk
            tauri-deps: false
          - workspace: crates/delta-connect
            tauri-deps: false
          - workspace: crates/delta-sync
            tauri-deps: false
          - workspace: crates/delta-stt
            tauri-deps: false
            stt-audio-deps: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read Rust toolchain channel
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(grep '^channel' rust-toolchain.toml | tr -d '\r' | sed 's/.*"\(.*\)"/\1/')
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: rustfmt, clippy
      - name: Install Tauri Linux system dependencies
        if: ${{ matrix.tauri-deps }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev
      - name: Install STT Linux audio dependencies
        if: ${{ matrix.stt-audio-deps }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ${{ matrix.workspace }}
      - name: Format
        working-directory: ${{ matrix.workspace }}
        run: cargo fmt --check
      - name: Check
        working-directory: ${{ matrix.workspace }}
        run: cargo check --locked
      - name: Clippy
        working-directory: ${{ matrix.workspace }}
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        working-directory: ${{ matrix.workspace }}
        run: cargo test --locked

  layout-check:
    name: layout-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enforce naming conventions
        run: python3 scripts/check_naming.py
      - name: Forbidden top-level directories
        shell: bash
        run: |
          set -euo pipefail
          for d in surfaces coworker assets src stt; do
            if [ -d "$d" ]; then
              echo "::error::Forbidden top-level directory '$d' present (see docs/architecture/repository-layout.md)"
              exit 1
            fi
          done
          echo "no forbidden top-level directories"
      - name: Retired theme runtime keys
        shell: bash
        run: |
          set -euo pipefail
          if grep -rn \
              "openwork-theme\|openwork:theme-pref" \
              apps \
              core \
              integrations \
              packages \
              services \
              tests \
              scripts \
              --include='*.ts' \
              --include='*.tsx' \
              --include='*.html' \
              --include='*.rs' \
              --include='*.py' \
              --include='*.js' \
              --include='*.json' \
              --include='*.css' \
              2>/dev/null \
            | grep -v 'apps/desktop/src/theme.ts' \
            | grep -v 'apps/desktop/index.html' \
            | grep -v 'apps/desktop/src-tauri/src/lib.rs'
          then
            echo "::error::Retired theme runtime key found in source; use delta-theme / delta:theme-pref"
            exit 1
          fi
          echo "no unexpected retired theme keys"
      - name: Deprecated migrated paths
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_retired_paths.py
      - name: Retired branding gate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_retired_branding.py
      - name: Architecture boundary guard
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_architecture_boundary.py

  validate-merge:
    name: validate-merge
    if: ${{ always() && (github.event_name == 'pull_request' || !cancelled()) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - changes
      - pytest
      - pytest-windows
      - desktop-unit
      - desktop-e2e
      - static
      - python-advisories
      - rust-advisories
      - rust
      - rust-core-smoke
      - layout-check
    steps:
      - name: Evaluate required checks
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          PYTHON_REQUIRED: ${{ needs.changes.outputs.python }}
          DESKTOP_REQUIRED: ${{ needs.changes.outputs.desktop }}
          RUST_REQUIRED: ${{ needs.changes.outputs.rust }}
          PYTHON_ADVISORIES_REQUIRED: ${{ needs.changes.outputs.python_advisories }}
          RUST_ADVISORIES_REQUIRED: ${{ needs.changes.outputs.rust_advisories }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          results = json.loads(os.environ["NEEDS_JSON"])
          python_required = os.environ["PYTHON_REQUIRED"] == "true"
          desktop_required = os.environ["DESKTOP_REQUIRED"] == "true"
          rust_required = os.environ["RUST_REQUIRED"] == "true"
          python_advisories_required = os.environ["PYTHON_ADVISORIES_REQUIRED"] == "true"
          rust_advisories_required = (
              os.environ["RUST_ADVISORIES_REQUIRED"] == "true"
              or rust_required
          )
          required = {
              "changes": True,
              "layout-check": True,
              "pytest": python_required,
              "pytest-windows": python_required,
              "static": python_required,
              "desktop-unit": desktop_required,
              "desktop-e2e": desktop_required,
              "python-advisories": python_advisories_required,
              "rust": rust_required,
              "rust-advisories": rust_advisories_required,
              "rust-core-smoke": rust_required,
          }
          failures = {}
          for name, expected in required.items():
              result = results[name]["result"]
              if expected:
                  if result != "success":
                      failures[name] = result
              elif result not in {"success", "skipped"}:
                  failures[name] = result
          if failures:
              print("validate-merge blocked by checks that did not succeed:")
              for name, result in failures.items():
                  print(f"  {name}: {result}")
              sys.exit(1)
          print("all required checks passed")
          PY

  validate-merge:
    name: validate-merge
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - ci-evidence
    steps:
      - name: Validate merge policy
        uses: fongap-labs/action-worker/.github/actions/validate-merge-policy@main
        with:
          ci-result: ${{ needs.ci-evidence.result }}
          head-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          require-pr-governance: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
