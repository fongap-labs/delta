[package]
name = "delta-stt"
version = "0.1.0"
description = "Local, offline speech-to-text engine for Delta hosts"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"

[dependencies]
cpal = "0.18.2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
bzip2 = "0.5"
tar = "0.4"
ureq = "3.4"
# Local recognition runs SenseVoice through sherpa-onnx (ONNX Runtime, linked statically from
# the project's prebuilt archive; set SHERPA_ONNX_LIB_DIR to build from a local copy).
sherpa-onnx = "2.0.0"
