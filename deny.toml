# cargo-deny policy for Delta.
#
# Security posture: vulnerabilities and unmaintained dependencies are denied by
# default except for the narrowly documented informational advisories below.
# License posture: Rust dependencies must resolve to an explicitly accepted SPDX
# license family. New license families require a deliberate policy change.

[advisories]
unmaintained = "all"
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error 1.0.4, transitive build dep; unmaintained, no vulnerability" },
    { id = "RUSTSEC-2026-0367", reason = "zip keeps SUID/SGID bits while extracting; Delta never extracts an archive to disk and the locked zip 2.4.2 (sherpa-onnx-sys) and 4.6.1 (tauri-plugin-updater) have no patched upstream release yet; impact, mitigation and upgrade plan in docs/governance/OPEN_ITEMS.md" },
    { id = "RUSTSEC-2026-0368", reason = "zip extract creates symlinks that point outside the destination; Delta never extracts an archive to disk and the locked zip 2.4.2 (sherpa-onnx-sys) and 4.6.1 (tauri-plugin-updater) have no patched upstream release yet; impact, mitigation and upgrade plan in docs/governance/OPEN_ITEMS.md" },
    { id = "RUSTSEC-2026-0369", reason = "zip extract applies Unix permissions through symlinks; Delta never extracts an archive to disk and the locked zip 2.4.2 (sherpa-onnx-sys) and 4.6.1 (tauri-plugin-updater) have no patched upstream release yet; impact, mitigation and upgrade plan in docs/governance/OPEN_ITEMS.md" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant is unmaintained; it arrives through zbus 5, which the Tauri plugins Delta uses still require, and zbus 6 has no plugin support yet; no vulnerability; upgrade plan in docs/governance/OPEN_ITEMS.md" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names is unmaintained; it arrives through zbus 5, which the Tauri plugins Delta uses still require, and zbus 6 has no plugin support yet; no vulnerability; upgrade plan in docs/governance/OPEN_ITEMS.md" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is unmaintained; it arrives through zbus 5, which the Tauri plugins Delta uses still require, and zbus 6 has no plugin support yet; no vulnerability; upgrade plan in docs/governance/OPEN_ITEMS.md" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
]
