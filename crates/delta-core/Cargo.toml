[package]
name = "delta-core"
version = "0.1.0"
description = "Delta Core Rust runtime and authority control plane"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[lib]
name = "delta_core"
crate-type = ["rlib"]

[[bin]]
name = "verify_ledger"
path = "src/bin/verify_ledger.rs"

[[bin]]
name = "dump_idemlog"
path = "src/bin/dump_idemlog.rs"

[[bin]]
name = "write_idemlog"
path = "src/bin/write_idemlog.rs"

[[bin]]
name = "write_ledger"
path = "src/bin/write_ledger.rs"

[[bin]]
name = "inspect_tasks"
path = "src/bin/inspect_tasks.rs"

[[bin]]
name = "inspect_artifact"
path = "src/bin/inspect_artifact.rs"

[[bin]]
name = "inspect_citation"
path = "src/bin/inspect_citation.rs"

[[bin]]
name = "inspect_validation"
path = "src/bin/inspect_validation.rs"

[[bin]]
name = "delta_core"
path = "src/bin/delta_core.rs"

[dependencies]
base64 = "0.22"
csv = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cron = "0.15"
delta-sdk = { path = "../delta-sdk" }
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
ureq = { version = "2", features = ["json"] }
url = "2"
webpki-roots = "0.26"

[dev-dependencies]
tempfile = "3"
